name: Build braze-components

on: push

permissions:
    id-token: write # Required for OIDC

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest

        if: >-
            github.event.pull_request.head.repo.owner.login == 'guardian' ||
              github.event_name == 'push'

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - run: npm install --global corepack@0.31.0
              shell: bash
            - run: corepack enable
              shell: bash

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.tool-versions'

            - name: Install dependencies
              run: pnpm install

            - name: Check typescript
              run: pnpm tsc

            - name: Lint
              run: pnpm lint

            - name: Run tests
              run: CI=true pnpm test

    hosted-storybook-build:
        name: Hosted Storybook build
        runs-on: ubuntu-latest
        needs: [tests]

        if: >-
            github.event.pull_request.head.repo.owner.login == 'guardian' ||
              github.event_name == 'push'

        permissions:
            id-token: write
            contents: read
            pull-requests: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - run: npm install --global corepack@0.31.0
              shell: bash
            - run: corepack enable
              shell: bash

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.tool-versions'

            - name: Install dependencies
              run: pnpm install

            - name: Storybook build
              run: pnpm build-storybook

            - name: Upload Storybook artifact
              uses: actions/upload-artifact@v4
              with:
                  name: storybook-static
                  path: storybook-static/
                  if-no-files-found: error

            - name: Upload authenticated Storybook build to Riff Raff
              uses: guardian/actions-static-site@v3.0.3
              with:
                  app: braze-components
                  domain: braze-components.gutools.co.uk
                  artifact: storybook-static
                  roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
                  githubToken: ${{ secrets.GITHUB_TOKEN }}

    release:
        name: Release
        needs: [tests]
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write # in order to write labels to main branch?
            pull-requests: write # to be able to comment on released pull requests
            id-token: write # to enable use of OIDC for npm provenance
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - run: npm install --global corepack@0.31.0
              shell: bash
            - run: corepack enable
              shell: bash

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.tool-versions'
                  registry-url: 'https://registry.npmjs.org'

            # Ensure npm 11 or later is installed
            - name: Update npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Release
              uses: changesets/action@v2
              with:
                  publish: pnpm changeset publish
                  setupGitUser: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
